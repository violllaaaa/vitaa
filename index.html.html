<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[ encrypted message ]</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
    color: #ff0033;
    cursor: default;
    -webkit-tap-highlight-color: transparent;
  }

  /* ================= INTRO ================= */
  #intro {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    padding: 24px;
    background: radial-gradient(circle at 50% 50%, #140006 0%, #000 70%);
    transition: opacity .9s ease, visibility .9s ease;
    z-index: 10;
  }
  #intro.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .sys {
    font-size: 13px;
    letter-spacing: 2px;
    color: #ff3355;
    text-shadow: 0 0 8px #ff0033;
    opacity: 0;
    animation: fadeUp .6s ease forwards .2s;
  }
  .sys .cursor {
    display: inline-block;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  h1.title {
    font-size: clamp(44px, 12vw, 100px);
    font-weight: 700;
    letter-spacing: 4px;
    color: #ff0033;
    text-shadow:
      0 0 6px  #ff0033,
      0 0 18px #ff0033,
      0 0 42px #ff0033,
      0 0 90px #ff0033;
    opacity: 0;
    animation: fadeUp .9s ease forwards .6s;
  }

  .pkg {
    font-size: clamp(12px, 2.4vw, 16px);
    letter-spacing: 1px;
    color: #ff4466;
    text-shadow: 0 0 8px #ff0033;
    opacity: 0;
    animation: fadeUp .7s ease forwards 1.1s;
  }

  #btn {
    margin-top: 14px;
    padding: 16px 40px;
    font-family: inherit;
    font-size: clamp(13px, 2.6vw, 16px);
    font-weight: 700;
    letter-spacing: 3px;
    color: #ff0033;
    background: rgba(255, 0, 51, .06);
    border: 1px solid #ff0033;
    border-radius: 4px;
    cursor: pointer;
    text-shadow: 0 0 8px #ff0033;
    box-shadow:
      0 0 12px rgba(255, 0, 51, .6),
      inset 0 0 14px rgba(255, 0, 51, .18);
    transition: background .3s, color .3s, box-shadow .3s, transform .15s;
    opacity: 0;
    animation:
      fadeUp .7s ease forwards 1.5s,
      btnPulse 2.2s ease-in-out infinite 2.3s;
  }
  #btn:hover {
    background: #ff0033;
    color: #000;
    text-shadow: none;
    box-shadow:
      0 0 25px #ff0033,
      0 0 70px #ff0033,
      inset 0 0 22px #ff8899;
  }
  #btn:active { transform: scale(.96); }

  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 0 12px rgba(255,0,51,.6), inset 0 0 14px rgba(255,0,51,.18); }
    50%      { box-shadow: 0 0 28px rgba(255,0,51,.95), inset 0 0 22px rgba(255,0,51,.38); }
  }

  .hint {
    font-size: 12px;
    letter-spacing: 1px;
    color: #7a0020;
    opacity: 0;
    animation: fadeUp .7s ease forwards 2s;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ================= CANVAS ================= */
  #c {
    position: fixed;
    inset: 0;
    display: block;
    opacity: 0;
    transition: opacity 1s ease .1s;
  }
  #c.show { opacity: 1; }

  #progress {
    position: fixed;
    left: 20px;
    bottom: 20px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    color: #ff0033;
    text-shadow: 0 0 8px #ff0033;
    opacity: 0;
    transition: opacity .5s ease;
    pointer-events: none;
    z-index: 5;
  }
  #progress.show { opacity: .75; }
</style>
</head>
<body>

<div id="intro">
  <div class="sys">[system] Initializing heart...<span class="cursor">_</span></div>
  <h1 class="title">Love you.</h1>
  <div class="pkg">&gt; One encrypted package found for you.</div>
  <button id="btn">🔒 DECRYPT MESSAGE</button>
  <div class="hint">(or just click anywhere)</div>
</div>

<canvas id="c"></canvas>
<div id="progress">[ decrypting... 0% ]</div>

<script>
(() => {
  'use strict';

  const intro    = document.getElementById('intro');
  const btn      = document.getElementById('btn');
  const canvas   = document.getElementById('c');
  const progress = document.getElementById('progress');
  const ctx      = canvas.getContext('2d');

  let W = 0, H = 0;
  let bgGradient = null;

  let words     = [];
  let sprites   = [];
  let rainDrops = [];
  let rainSprite = null;

  let started   = false;
  let startTime = 0;

  /* ------------------------------------------------------------------ */
  /*  Формула сердца                                                     */
  /* ------------------------------------------------------------------ */
  const fx = t => 16 * Math.pow(Math.sin(t), 3);
  const fy = t => 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);

  const HEART_CENTER_Y = -2.5;

  /* ==================================================================== */
  /*  ОБЩЕЕ ВРЕМЯ СБОРКИ (секунды)                                        */
  /*  хочешь ещё медленнее — увеличивай                                         */
  /* ==================================================================== */
  const TOTAL_TIME = 25;

  /* ------------------------------------------------------------------ */
  /*  Спрайт «i love you» — крупный и КРАСНЫЙ                            */
  /* ------------------------------------------------------------------ */
  function makeSprite(size, core, glow, blur) {
    const pad = Math.ceil(blur) + 6;

    const measure = document.createElement('canvas').getContext('2d');
    measure.font = `900 ${size}px "Courier New", monospace`;
    const tw = Math.ceil(measure.measureText('i love you').width);
    const th = Math.ceil(size * 1.6);

    const c = document.createElement('canvas');
    c.width  = tw + pad * 2;
    c.height = th + pad * 2;

    const g = c.getContext('2d');
    g.font = `900 ${size}px "Courier New", monospace`;
    g.textAlign    = 'center';
    g.textBaseline = 'middle';

    g.shadowColor = glow;
    g.fillStyle   = glow;
    g.shadowBlur  = blur * 1.6;
    g.fillText('i love you', c.width / 2, c.height / 2);
    g.fillText('i love you', c.width / 2, c.height / 2);

    g.shadowBlur = blur;
    g.fillText('i love you', c.width / 2, c.height / 2);

    g.shadowBlur = blur * 0.4;
    g.fillStyle  = core;
    g.fillText('i love you', c.width / 2, c.height / 2);

    return { img: c, w: c.width, h: c.height };
  }

  function buildSprites() {
    sprites = [];
    const sizes  = [12, 14, 16, 18];
    const colors = [
      { core: '#ff0022', glow: '#ff0000', blur: 14 },
      { core: '#ff1030', glow: '#e60000', blur: 16 },
      { core: '#ff2040', glow: '#ff0011', blur: 15 },
      { core: '#ff5a70', glow: '#ff0000', blur: 13 }
    ];
    for (const s of sizes) {
      for (const col of colors) {
        sprites.push(makeSprite(s, col.core, col.glow, col.blur));
      }
    }
  }

  /* ------------------------------------------------------------------ */
  /*  Спрайт для фонового дождя «love you»                               */
  /* ------------------------------------------------------------------ */
  function buildRainSprite() {
    const size = 14;
    const pad = 10;

    const measure = document.createElement('canvas').getContext('2d');
    measure.font = `700 ${size}px "Courier New", monospace`;
    const tw = Math.ceil(measure.measureText('love you').width);
    const th = Math.ceil(size * 1.5);

    const c = document.createElement('canvas');
    c.width  = tw + pad * 2;
    c.height = th + pad * 2;

    const g = c.getContext('2d');
    g.font = `700 ${size}px "Courier New", monospace`;
    g.textAlign    = 'center';
    g.textBaseline = 'middle';

    g.shadowColor = '#ff0033';
    g.fillStyle   = '#ff0033';
    g.shadowBlur  = 8;
    g.fillText('love you', c.width / 2, c.height / 2);

    g.shadowBlur = 4;
    g.fillStyle  = '#ff3355';
    g.fillText('love you', c.width / 2, c.height / 2);

    rainSprite = { img: c, w: c.width, h: c.height };
  }

  function initRain() {
    rainDrops = [];
    const count = Math.floor(W / 100) + 8;
    for (let i = 0; i < count; i++) {
      rainDrops.push({
        x:     (i + 0.5) * (W / count) + (Math.random() - 0.5) * 50,
        y0:    Math.random() * (H + 200),
        speed: 25 + Math.random() * 70,
        size:  0.7 + Math.random() * 0.9,
        alpha: 0.05 + Math.random() * 0.11
      });
    }
  }

  /* ------------------------------------------------------------------ */
  /*  Генерация точек сердца                                             */
  /* ------------------------------------------------------------------ */
  function buildWords() {
    words = [];

    const STEPS = 2400;
    const pts = [];
    for (let i = 0; i <= STEPS; i++) {
      const t = (i / STEPS) * Math.PI * 2;
      pts.push([fx(t), fy(t)]);
    }

    const cum = [0];
    for (let i = 1; i <= STEPS; i++) {
      cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    }
    const totalLen = cum[STEPS];

    const pointAtLen = (L) => {
      let lo = 0, hi = STEPS;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (cum[mid] < L) lo = mid + 1; else hi = mid;
      }
      const i = Math.max(1, lo);
      const seg = (cum[i] - cum[i - 1]) || 1e-6;
      const k = (L - cum[i - 1]) / seg;
      return [
        pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * k,
        pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * k
      ];
    };

    const pushWord = (tx, ty) => {
      // --- полярная цель ---
      const dx = tx;
      const dy = ty - HEART_CENTER_Y;
      const rT = Math.hypot(dx, dy);
      const aT = Math.atan2(dy, dx);

      // --- стартовая полярная позиция ---
      const rS = rT + 55 + Math.random() * 75;       // чуть дальше стартует
      const aS = aT + (Math.random() - 0.5) * 3.0;

      // --- сколько оборотов сделает слово, пока летит (БОЛЬШЕ оборотов) ---
      const spins = 3 + Math.random() * 5;            // 3..8 оборотов
      const dir   = Math.random() < 0.5 ? 1 : -1;

      // === ЗАДЕРЖКА: за весь TOTAL_TIME секунд ===
      // Math.pow(...,1.15) слегка сдвигает распределение ближе к концу
      const delay = Math.pow(Math.random(), 1.15) * (TOTAL_TIME - 4);

      // === ДОЛГИЙ ПОЛЁТ — медленный, тягучий ===
      const dur = 4.5 + Math.random() * 4.0;          // 4.5..8.5 сек

      // === ГЛИТЧ подольше, чтобы слово "билось" ===
      const glitchDur  = 0.6 + Math.random() * 1.4;   // 0.6..2.0 сек
      const glitchFreq = 22 + Math.random() * 55;

      // доп. "судорога" во время полёта — дрожь
      const tremorAmp  = 0.02 + Math.random() * 0.08;
      const tremorFreq = 8 + Math.random() * 22;
      const tremorPhase= Math.random() * Math.PI * 2;

      words.push({
        tx, ty,
        rT, aT,
        rS, aS,
        spins, dir,
        delay, dur,
        glitchDur, glitchFreq,
        tremorAmp, tremorFreq, tremorPhase,
        sprite: (Math.random() * sprites.length) | 0,
        phase:  Math.random() * Math.PI * 2,
        speed:  0.8 + Math.random() * 1.6,
        base:   0.80 + Math.random() * 0.20,
        amp:    0.10 + Math.random() * 0.15,
        waveAngle: aT
      });
    };

    /* --- контур --- */
    const CONTOUR = 620;
    for (let i = 0; i < CONTOUR; i++) {
      const L = (i / CONTOUR) * totalLen;
      const [x, y] = pointAtLen(L);
      const j = 0.30;
      pushWord(x + (Math.random() - 0.5) * j, y + (Math.random() - 0.5) * j);
    }

    /* --- внутренняя заливка --- */
    const INNER = 900;
    for (let i = 0; i < INNER; i++) {
      const t = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()) * 0.98;
      pushWord(fx(t) * r, fy(t) * r);
    }
  }

  /* ------------------------------------------------------------------ */
  /*  Размер холста                                                      */
  /* ------------------------------------------------------------------ */
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width  = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    bgGradient = ctx.createRadialGradient(
      W / 2, H / 2, 0,
      W / 2, H / 2, Math.max(W, H) * 0.7
    );
    bgGradient.addColorStop(0, 'rgba(80, 0, 14, 0.85)');
    bgGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

    if (started) initRain();
  }

  window.addEventListener('resize', resize);

  /* ------------------------------------------------------------------ */
  /*  Easing                                                             */
  /* ------------------------------------------------------------------ */
  // Медленный, тягучий выход — слово долго "ползёт" в цель
  const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
  const easeInOut    = x => x < 0.5
    ? 4 * x * x * x
    : 1 - Math.pow(-2 * x + 2, 3) / 2;

  /* ------------------------------------------------------------------ */
  /*  Фоновый дождь «love you»                                          */
  /* ------------------------------------------------------------------ */
  function drawRain(t) {
    ctx.globalCompositeOperation = 'source-over';

    const total = H + 200;
    for (let i = 0; i < rainDrops.length; i++) {
      const d = rainDrops[i];
      const y = ((d.y0 + t * d.speed) % total) - 100;

      const dw = rainSprite.w * d.size;
      const dh = rainSprite.h * d.size;

      ctx.globalAlpha = d.alpha;
      ctx.drawImage(rainSprite.img, d.x - dw / 2, y - dh / 2, dw, dh);
    }

    ctx.globalAlpha = 1;
  }

  /* ------------------------------------------------------------------ */
  /*  Главный цикл отрисовки                                             */
  /* ------------------------------------------------------------------ */
  function frame(now) {
    if (!started) return;
    if (!startTime) startTime = now;

    const t = (now - startTime) / 1000;

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, W, H);

    drawRain(t);

    const scale = Math.min(W, H) / 32;
    const cx = W / 2;
    const cy = H / 2;

    ctx.globalCompositeOperation = 'lighter';

    // луч перелива
    const waveSpeed = 1.6;
    const waveAngle = t * waveSpeed;

    for (let i = 0; i < words.length; i++) {
      const w = words[i];

      if (t < w.delay) continue;
      const life = t - w.delay;

      // ---- прогресс полёта ----
      let p = life / w.dur;
      if (p > 1) p = 1;

      // Тягучий easing: сначала разгон медленный, к концу долго "прилипает"
      const e = easeOutCubic(p);

      // ---- полярная позиция по спирали ----
      let angle  = w.aT
                 + (w.aS - w.aT) * (1 - e)
                 + (1 - e) * Math.PI * 2 * w.spins * w.dir;
      let radius = w.rT + (w.rS - w.rT) * (1 - e);

      // ---- ДРОЖЬ во время полёта (пока не прилетело) ----
      if (p < 1) {
        const tremor = Math.sin(life * w.tremorFreq + w.tremorPhase) * w.tremorAmp * (1 - p);
        angle  += tremor;
        radius += tremor * radius * 0.6;
      }

      const hx = Math.cos(angle) * radius;
      const hy = Math.sin(angle) * radius;

      const px = cx + hx * scale;
      const py = cy - hy * scale;

      // ---- ГЛИТЧ при появлении ----
      let glitchAlpha = 1;
      if (life < w.glitchDur) {
        const g = Math.sin(life * w.glitchFreq) * 0.5 + 0.5;
        const dropout = Math.sin(life * w.glitchFreq * 0.37) > 0.6 ? 0 : 1;
        const fadeGlitch = 1 - life / w.glitchDur;
        glitchAlpha = (0.35 + 0.65 * g) * dropout * fadeGlitch + (1 - fadeGlitch);
      }

      // ---- ПЕРЕЛИВ ----
      let dAng = w.waveAngle - waveAngle;
      dAng = ((dAng % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      if (dAng > Math.PI) dAng -= Math.PI * 2;

      const waveBoost = Math.exp(-Math.pow(dAng * 3.2, 2)) * 0.95;

      // ---- мерцание ----
      const flick = Math.sin(t * w.speed + w.phase);
      let alpha = (w.base + w.amp * flick + waveBoost) * glitchAlpha;

      // плавное "пробуждение" по мере полёта
      alpha *= 0.15 + 0.85 * e;

      if (alpha <= 0.02) continue;
      if (alpha > 1) alpha = 1;

      // ---- рисуем ----
      const sizeBoost = 1 + waveBoost * 0.10;
      const sp = sprites[w.sprite];
      const dw = sp.w * sizeBoost;
      const dh = sp.h * sizeBoost;

      ctx.globalAlpha = alpha;
      ctx.drawImage(sp.img, px - dw / 2, py - dh / 2, dw, dh);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    // прогресс
    const pct = Math.min(100, Math.round((t / TOTAL_TIME) * 100));
    if (t < TOTAL_TIME + 2) {
      progress.textContent = `[ decrypting... ${pct}% ]`.padEnd(30, ' ');
    } else if (progress.textContent.indexOf('done') === -1) {
      progress.textContent = `[ message decrypted: ${words.length} words ]`;
    }

    requestAnimationFrame(frame);
  }

  /* ------------------------------------------------------------------ */
  /*  Запуск                                                             */
  /* ------------------------------------------------------------------ */
  function start() {
    if (started) return;
    started = true;

    intro.classList.add('hidden');

    setTimeout(() => {
      canvas.classList.add('show');
      progress.classList.add('show');
      initRain();
      startTime = 0;
      requestAnimationFrame(frame);
    }, 700);
  }

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    start();
  });

  document.addEventListener('click', start);
  document.addEventListener('touchstart', start, { passive: true });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') start();
  });

  /* ------------------------------------------------------------------ */
  /*  Инициализация                                                      */
  /* ------------------------------------------------------------------ */
  resize();
  buildSprites();
  buildRainSprite();
  buildWords();

})();
</script>

</body>
</html>
